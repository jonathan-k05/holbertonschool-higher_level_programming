<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conversational Data Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #8a93a3;
    --accent: #4f8cff;
    --safe: #2ecc71;
    --danger: #ff5c5c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--safe);
    border: 1px solid var(--safe);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--safe);
  }
  #api-config {
    font-size: 11px;
    color: var(--muted);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--accent);
    color: white;
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    padding: 10px 14px;
  }
  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 2px;
    padding: 12px 16px;
    width: 100%;
  }
  .answer-text { font-size: 15px; line-height: 1.5; margin: 0 0 10px 0; }
  .error-text { color: var(--danger); font-size: 14px; }
  details {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 8px;
    padding: 8px 12px;
  }
  summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    user-select: none;
  }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12.5px;
    color: #c9d1e0;
    margin: 8px 0 0 0;
    font-family: "SF Mono", Consolas, monospace;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 13px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  th { background: var(--panel-2); color: var(--muted); font-weight: 500; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .row-count { font-size: 11px; color: var(--muted); margin-top: 6px; }
  canvas { max-height: 280px; margin-top: 14px; }
  #input-bar {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    background: var(--panel);
    display: flex;
    justify-content: center;
  }
  #input-inner {
    max-width: 900px;
    width: 100%;
    display: flex;
    gap: 10px;
  }
  #question {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
  }
  #question:focus { outline: none; border-color: var(--accent); }
  button#send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .example-chip {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    background: var(--panel-2);
  }
  .example-chip:hover { color: var(--text); border-color: var(--accent); }
  .loading { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Conversational Data Explorer</h1>
  <div style="display:flex; align-items:center; gap:14px;">
    <span id="api-config"></span>
    <div class="badge">Lecture seule &middot; sécurisé</div>
  </div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <div id="input-inner">
    <input id="question" type="text" placeholder="Posez une question sur les données… (ex: quels sont les 5 plus gros clients ?)" />
    <button id="send">Envoyer</button>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000"; // change si le backend tourne ailleurs
document.getElementById("api-config").textContent = API_BASE;

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendBtn = document.getElementById("send");

const EXAMPLE_QUESTIONS = [
  "Combien de commandes par région ?",
  "Quels clients ont des paiements en retard ?",
  "Quel est le montant total des commandes fermées ?",
  "Top 5 des clients par montant total dépensé",
];

function renderIntro() {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.innerHTML = `
    <div class="bubble">
      <p class="answer-text">Posez une question en langage naturel sur la base de données. Exemples :</p>
      <div class="examples">
        ${EXAMPLE_QUESTIONS.map(q => `<span class="example-chip">${escapeHtml(q)}</span>`).join("")}
      </div>
    </div>`;
  chat.appendChild(wrap);
  wrap.querySelectorAll(".example-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      input.value = chip.textContent;
      askQuestion();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function addUserMessage(text) {
  const wrap = document.createElement("div");
  wrap.className = "msg user";
  wrap.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function addLoadingMessage() {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.id = "loading-msg";
  wrap.innerHTML = `<div class="bubble"><span class="loading">Analyse de la question…</span></div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function addErrorMessage(message) {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.innerHTML = `<div class="bubble"><p class="error-text">⚠️ ${escapeHtml(message)}</p></div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function addAnswerMessage(data) {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const answerP = document.createElement("p");
  answerP.className = "answer-text";
  answerP.textContent = data.answer;
  bubble.appendChild(answerP);

  // Table
  if (data.rows && data.rows.length > 0) {
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    thead.innerHTML = `<tr>${data.columns.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
    table.appendChild(thead);
    const tbody = document.createElement("tbody");
    data.rows.slice(0, 50).forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = data.columns.map(c => `<td>${escapeHtml(String(row[c] ?? ""))}</td>`).join("");
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    bubble.appendChild(table);

    const rowCount = document.createElement("div");
    rowCount.className = "row-count";
    rowCount.textContent = `${data.row_count} ligne(s) retournée(s)`;
    bubble.appendChild(rowCount);

    // Chart if it looks like an aggregate: 2 columns, second one numeric
    if (data.columns.length === 2 && isNumericColumn(data.rows, data.columns[1])) {
      const canvas = document.createElement("canvas");
      bubble.appendChild(canvas);
      setTimeout(() => renderChart(canvas, data), 0);
    }
  }

  // Collapsible SQL
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  summary.textContent = "Voir le SQL exécuté (lecture seule)";
  const pre = document.createElement("pre");
  pre.textContent = data.sql;
  details.appendChild(summary);
  details.appendChild(pre);
  bubble.appendChild(details);

  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function isNumericColumn(rows, colName) {
  return rows.every(r => typeof r[colName] === "number" || !isNaN(parseFloat(r[colName])));
}

function renderChart(canvas, data) {
  const labelCol = data.columns[0];
  const valueCol = data.columns[1];
  new Chart(canvas, {
    type: "bar",
    data: {
      labels: data.rows.map(r => String(r[labelCol])),
      datasets: [{
        label: valueCol,
        data: data.rows.map(r => Number(r[valueCol])),
        backgroundColor: "#4f8cff",
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8a93a3" }, grid: { color: "#2a2f3a" } },
        y: { ticks: { color: "#8a93a3" }, grid: { color: "#2a2f3a" } },
      }
    }
  });
}

async function askQuestion() {
  const question = input.value.trim();
  if (!question) return;

  addUserMessage(question);
  input.value = "";
  sendBtn.disabled = true;
  const loadingEl = addLoadingMessage();

  try {
    const resp = await fetch(`${API_BASE}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });

    loadingEl.remove();

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      addErrorMessage(err.detail || `Erreur ${resp.status}`);
      return;
    }

    const data = await resp.json();
    addAnswerMessage(data);
  } catch (e) {
    loadingEl.remove();
    addErrorMessage(`Impossible de contacter l'API (${API_BASE}). Le backend est-il lancé ?`);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", askQuestion);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") askQuestion();
});

renderIntro();
</script>
</body>
</html>
